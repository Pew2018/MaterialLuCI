name: Runtime enhancement scroll evidence
on:
  push:
    branches: [feature/m3e-theme]
    paths: ["theme/**", "ci/scroll-runtime.mjs", "ci/trace-costs.mjs", ".github/workflows/scroll-runtime.yml"]
concurrency:
  group: scroll-runtime-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  isolation:
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: python3 scripts/build.py
      - uses: actions/checkout@v4
        with:
          repository: openwrt/luci
          ref: e4c46338b196e486a88b1a75b78e283708c82bc4
          path: luci-fixture
      - uses: actions/checkout@v4
        with:
          repository: immortalwrt/luci
          ref: 5829eabba50ec0afa17d2ee486bc90dc15180c34
          path: immortal-fixture
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          python3 ci/ipk-audit.py dist/*.ipk --sha "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --out build/isolation-audit.json --extract build/unpacked --candidate
          python3 ci/prepare.py
      - run: xvfb-run -a node ci/scroll-runtime.mjs
        env:
          ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-evidence-${{ matrix.engine }}-${{ github.sha }}
          path: |
            dist/runtime-evidence/
            build/isolation-audit.json
