name: Build Lua IPK and pinned ucode APK
on:
  push:
    branches: [main, "feature/**", "fix/**"]
    paths-ignore: ["docs/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: materialluci-${{ github.ref }}
  cancel-in-progress: true
env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          npm install --no-audit --no-fund
      - name: Validate shipped scripts and templates
        run: |
          for file in theme/root/www/luci-static/materialluci/*.js; do node --check "$file"; done
          python3 -m py_compile scripts/build.py ci/ipk-audit.py ci/template-syntax.py
          node -e 'new Function(require("fs").readFileSync("theme/root/www/luci-static/resources/materialluci-menu.js","utf8"))'
          sh -n theme/control/postinst
          sh -n theme/control/prerm
          sh -n theme/root/etc/uci-defaults/95-materialluci
          python3 ci/template-syntax.py
          node ci/performance-contracts.mjs
      - name: Build and audit actual IPK
        env:
          GITHUB_SHA: ${{ env.SOURCE_SHA }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python3 scripts/build.py
          python3 ci/ipk-audit.py dist/*.ipk --sha "$SOURCE_SHA" --run "$GITHUB_RUN_ID" --out build/package-audit.json --candidate
      - name: Write concise build manifest
        id: manifest
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          meta=json.loads(pathlib.Path("theme/package.json").read_text())
          audit=json.loads(pathlib.Path("build/package-audit.json").read_text())
          manifest={k:meta[k] for k in ("name","version","architecture","target")}
          manifest.update(commit=os.environ["SOURCE_SHA"],branch=os.environ["SOURCE_BRANCH"],run_id=os.environ["GITHUB_RUN_ID"],ipk=audit["ipk"],ipk_sha256=audit["ipk_sha256"],resource_cache=audit["resource_cache"],checks=audit["checks"])
          pathlib.Path("dist/build-manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          name=f'MaterialLuCI-lua-{meta["version"]}-{meta["architecture"]}-{os.environ["SOURCE_SHA"][:12]}'
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:out.write("name="+name+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("## Installable package\n\n")
              for key,value in manifest.items():out.write(f"- {key}: `{value}`\n")
              out.write("\nPackage integrity checked. Router UI and performance require user testing.\n")
          PY
      - name: Upload IPK and build manifest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.manifest.outputs.name }}
          path: |
            dist/*.ipk
            dist/build-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Stage modern ucode package
        if: github.ref_name == 'feature/modern-luci'
        run: python3 scripts/modern-prepare.py
      - name: Restore pinned SDK host dependency cache
        if: github.ref_name == 'feature/modern-luci'
        uses: actions/cache/restore@v4
        with:
          path: |
            build/openwrt-sdk-*/dl
            build/openwrt-sdk-*/build_dir/host*
            build/openwrt-sdk-*/staging_dir/hostpkg
          key: modern-host-${{ runner.os }}-${{ hashFiles('ci/modern-target.json') }}
      - name: Build pinned OpenWrt 25.12.5 APK with SDK
        id: sdk
        if: github.ref_name == 'feature/modern-luci'
        run: |
          sudo apt-get install -y build-essential libncurses-dev zlib1g-dev gawk gettext libssl-dev unzip rsync file zstd python3-setuptools
          python3 ci/modern-sdk.py
      - name: Save pinned SDK host dependency cache
        if: always() && github.ref_name == 'feature/modern-luci' && steps.sdk.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            build/openwrt-sdk-*/dl
            build/openwrt-sdk-*/build_dir/host*
            build/openwrt-sdk-*/staging_dir/hostpkg
          key: modern-host-${{ runner.os }}-${{ hashFiles('ci/modern-target.json') }}
      - name: Audit real modern APK
        if: github.ref_name == 'feature/modern-luci'
        id: modern
        run: |
          python3 ci/modern-apk-audit.py
          python3 ci/modern-install-audit.py
          python3 - <<'PY'
          import json,os,pathlib
          m=json.loads(pathlib.Path("dist/modern/build-manifest.json").read_text())
          name=f'MaterialLuCI-ucode-{m["version"]}-OpenWrt-{m["target"]["openwrt"]}-{m["architecture"]}-{m["commit"][:12]}'
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:f.write("name="+name+"\n")
          PY
      - name: Validate modern templates and representative native contracts
        if: always() && github.ref_name == 'feature/modern-luci' && steps.sdk.outcome == 'success'
        run: |
          python3 ci/modern-test-prepare.py
          npx playwright install --with-deps chromium
          python3 ci/modern-server.py &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node ci/modern-browser.mjs
      - name: Upload modern APK and provenance
        if: github.ref_name == 'feature/modern-luci'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.modern.outputs.name }}
          path: dist/modern/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload focused diagnostics on failure
        if: failure() && github.ref_name == 'feature/modern-luci'
        uses: actions/upload-artifact@v4
        with:
          name: modern-validation-diagnostics-${{ env.SOURCE_SHA }}
          path: |
            dist/modern/modern-failure.png
            dist/modern/template-checks.json
            dist/modern/install-checks.json
          if-no-files-found: ignore
          retention-days: 7
