name: Build AX3000T Classic Native
on:
  push:
    branches: [main, "feature/**", "fix/**"]
    paths-ignore: ["docs/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: materialluci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Lua build tools
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Install pinned Node dependencies
        timeout-minutes: 5
        run: npm install --no-audit --no-fund
      - name: Install Chromium and WebKit test engines
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium webkit
      - name: Validate script syntax
        run: |
          for file in theme/root/www/luci-static/materialluci/*.js; do node --check "$file"; done
          node --check ci/browser.mjs
          node -e 'new Function(require("fs").readFileSync("theme/root/www/luci-static/resources/materialluci-menu.js","utf8"))'
          sh -n theme/control/postinst
          sh -n theme/control/prerm
          sh -n theme/root/etc/uci-defaults/95-materialluci
      - name: Check semantic colors
        run: node ci/colors.cjs
      - name: Download the user-tested baseline IPK
        uses: actions/download-artifact@v4
        with:
          name: MaterialLuCI-0.3.0-IPK-in-ZIP-AX3000T-aarch64_cortex-a53
          run-id: 38020573064
          github-token: ${{ github.token }}
          path: build/baseline
      - name: Audit baseline package identity and actual resources
        run: |
          python3 ci/ipk-audit.py build/baseline/*.ipk --sha e7188f7df2d979899e78e151aebb94f7528c4b83 --run 38020573064 --out dist/previews/baseline-ipk.json
      - name: Build and inspect target IPK
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python3 scripts/build.py
          python3 ci/ipk-audit.py dist/*.ipk --sha "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --out build/package-audit.json --extract build/unpacked --candidate
      - name: Obtain pinned upstream LuCI for browser compatibility tests
        uses: actions/checkout@v4
        with:
          repository: openwrt/luci
          ref: e4c46338b196e486a88b1a75b78e283708c82bc4
          path: luci-fixture
          sparse-checkout: |
            modules/luci-base/htdocs/luci-static/resources
            applications/luci-app-opkg/htdocs/luci-static/resources
            modules/luci-mod-status/htdocs/luci-static/resources
      - name: Compile Lua templates and prepare compatibility preview
        run: python3 ci/prepare.py
      - name: Test desktop and mobile layouts in Chromium and WebKit
        run: |
          mkdir -p dist/previews
          cp build/package-audit.json dist/previews/package-audit.json
          git rev-parse HEAD > dist/previews/commit.txt
          sha256sum build/stage/www/luci-static/materialluci/*.js build/stage/www/luci-static/materialluci/*.css build/stage/www/luci-static/materialluci/icons/*.svg > dist/previews/assets.sha256
          node ci/browser.mjs
      - name: Produce screenshot contact sheets for visual review
        if: always()
        run: node ci/contact-sheet.mjs
      - name: Upload the single IPK (GitHub downloads artifacts as ZIP)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MaterialLuCI-0.3.0-2-IPK-${{ github.sha }}-AX3000T
          path: dist/*.ipk
          if-no-files-found: error
          retention-days: 30

      - name: Upload browser previews and source identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MaterialLuCI-UI-previews-${{ github.sha }}
          path: dist/previews/
          if-no-files-found: warn
          retention-days: 30
