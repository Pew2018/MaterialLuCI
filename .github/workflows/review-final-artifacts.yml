name: Review selected package
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Exact successful package build run ID
        required: true
      commit:
        description: Exact source commit SHA (40 hex characters)
        required: true
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate selected run and resolve artifact
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN: ${{ inputs.run_id }}
          TARGET_SHA: ${{ inputs.commit }}
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request
          run=os.environ["TARGET_RUN"];sha=os.environ["TARGET_SHA"]
          assert run.isdigit() and re.fullmatch("[0-9a-fA-F]{40}",sha)
          base="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]
          def get(path):
              request=urllib.request.Request(base+path,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
              return json.load(urllib.request.urlopen(request))
          info=get("/actions/runs/"+run)
          assert info["head_sha"].lower()==sha.lower() and info["conclusion"]=="success"
          artifacts=get("/actions/runs/"+run+"/artifacts")["artifacts"]
          matches=[a for a in artifacts if not a["expired"] and sha[:12] in a["name"] and a["name"].startswith("MaterialLuCI-") and "previews" not in a["name"]]
          assert len(matches)==1,[a["name"] for a in artifacts]
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:out.write("artifact="+matches[0]["name"]+"\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.target.outputs.artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: review
      - name: Verify downloaded package identity
        env:
          TARGET_SHA: ${{ inputs.commit }}
          TARGET_RUN: ${{ inputs.run_id }}
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib,os
          manifest=json.loads(pathlib.Path("review/build-manifest.json").read_text())
          package=pathlib.Path("review")/manifest["ipk"]
          assert manifest["commit"].lower()==os.environ["TARGET_SHA"].lower()
          assert str(manifest["run_id"])==os.environ["TARGET_RUN"]
          assert hashlib.sha256(package.read_bytes()).hexdigest()==manifest["ipk_sha256"]
          print(json.dumps(manifest,indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:out.write("Selected package identity and SHA256 verified. This is not router UI acceptance.\n")
          PY
