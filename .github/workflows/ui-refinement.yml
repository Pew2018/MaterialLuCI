name: Scoped UI refinement regression
on:
  push:
    branches: [feature/m3e-theme]
    paths: ["theme/**", "ci/ui-refinement.mjs", "ci/theme-coverage.mjs", "ci/followup*.mjs", "ci/performance-contracts.mjs", ".github/workflows/ui-refinement.yml"]
permissions:
  contents: read
jobs:
  representative:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: python3 scripts/build.py
      - run: node ci/followup-probe.mjs
      - run: node ci/ui-refinement.mjs
      - run: node ci/followup-regression.mjs
      - run: node ci/theme-coverage.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-refinement-${{ github.sha }}
          path: dist/ui-refinement/
